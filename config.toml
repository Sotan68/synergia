# Synergia defaults and technical settings.
#
# Your own choices (brand name, logo, niche, theme, engines...) live in profile.toml, which the
# setup wizard writes on first launch and the Settings page edits later. profile.toml is merged
# over this file, so anything below can be overridden there. Look/colour sections ([paper],
# [quiz], fonts) come from the chosen theme preset (synergia/brand/themes.py).

# Name, canvas size, and the dark colours of the browser interface.
[brand]
name = "My Brand"
logo = ""                 # PNG with transparency, shown in every slide footer ("" = drawn mark)
width = 1080
height = 1920
background = "#0A0B1A"
text = "#F5F7FF"          # cool white
accent = "#6FA8FF"        # electric blue (highlighted words)
accent2 = "#A78BFA"       # soft purple (labels, rules, wordmark)
muted = "#8B90B8"         # secondary text (labels, cues)

[fonts]
bold = "assets/fonts/Inter-Bold.ttf"
semibold = "assets/fonts/Inter-SemiBold.ttf"
medium = "assets/fonts/Inter-Medium.ttf"
black = "assets/fonts/Inter-Black.ttf"
# The slide fonts (serif / serif_italic = headlines, display_medium / display_semibold = text,
# paragraph = Engine A slides 2-3, numeral = Engine B numbers, quiz_* = Engines D / E) come from
# the theme. A variable font takes its axes after "|", e.g. "assets/fonts/X.ttf|Weight=500".
line_spacing = 1.2

# The look: synergia, notebook, cobalt, midnight, sunset, minimal, gazette, terminal or pop
# (synergia/brand/themes.py).
# A theme sets the fonts and colours plus:
#   [paper]  Engine A / B colours (background, background2, ink, soft, accent, accent2) and
#            texture (grain, mottle, tint)
#   [layout] bg = paper | grid | gradient | flat, align = left | center,
#            highlight = italic | color | marker | underline (marker, marker_ink),
#            header = rule | pill | plain
#   [quiz]   Engine D / E style = sheet | grid | cobalt | plain, surface, text, muted, accents
# Override any single value in your profile, e.g. [paper] accent = "#FF5500".
[theme]
preset = "synergia"

[quiz]
cobalt = "#2A45F2"        # "cobalt" style: top of the screen
cobalt2 = "#4A2FD6"       # "cobalt" style: bottom of the screen

# ---------------------------------------------------------------- your niche
# Everything Claude writes follows this. The setup wizard drafts it from a short description.
[voice]
niche = "everyday life, useful ideas and real experiences"   # "...a short-form brand about <niche>."
niche_short = "everyday life, useful ideas"                    # podcast clip finder: "editor for <name> (<niche_short>)"
clip_payoff = "a useful idea or a raw human experience"        # what a good podcast clip delivers
audience = ""                                                  # optional, e.g. "busy parents in their 30s"
tone = 'minimalist, direct, second-person ("you"), slightly provocative, emotionally sharp'
topic_scope = ["habits", "work", "relationships", "money", "health", "self-image"]
concept_kind = "ideas for 10-second explainers: named effects, rules, laws or phenomena"
concept_examples = []                                          # e.g. ["The Spotlight Effect"]
carousel_kind = "practical-advice"                             # "hooks for 5-point <carousel_kind> carousels"
hook_examples = []                                             # e.g. ["5 things people regret not doing after 25"]

# Example text shown in the app's input boxes and given to Claude as style examples.
[voice.examples]
concept = "The Spotlight Effect"
hook = "5 habits that quietly change your year"
checklist_cover = "signs you **overthink** everything"
pick_cover = "Pick a **door** and see what it says about you"
checklist_topic = "signs you're secretly a night owl"
pick_topic = "pick a door to see your work style"

# Engine A's 4 steps. The step keys stay the same; the labels and instructions are yours.
[engine_a.wording]
kind = ""                                          # "Write a 10-second <kind> explainer" ("" = no word)
intro_label = "Explained in 10 seconds"            # under the title on slide 1
step_labels = ["The problem", "How it works", "The takeaway"]   # headers of slides 2, 3, 4
title_template = "{concept}, explained in 10 seconds"
hook_line = 'the "why it matters" line that follows "<Concept> explained in 10 seconds:"'
gotcha = "a hyper-relatable scenario that makes the viewer feel seen"
mechanism = "how it actually works, in plain language"
shift = "one punchy concluding sentence that reframes everything"

# The first hashtag of each list is suggested to Claude; Engine D samples from its list.
[hashtags]
A = []
B = []
C = ["#podcast"]
D = ["#braintest", "#brainteaser", "#iqtest", "#puzzle", "#challenge", "#focus", "#memorytest",
     "#mindgames"]
E_checklist = []
E_pick = ["#personalitytest"]

[engines]
enabled = ["A", "B", "C", "D", "E"]

# Names shown in the app and used for output folders (output/A - <name>/...).
[engines.names]
A = "Explainer"
B = "Slideshow"
C = "Podcast Clipper"
D = "Brain Test"
E = "Which One Are You"

# Safe zone for TikTok / Reels / Shorts UI (pixels on the 1080x1920 canvas).
[safe_zone]
left = 90
right = 930
top = 250
bottom = 1440

[sound]
# Keyboard-typing sound on Engine A/B videos, synced letter-by-letter to the typed text (real CC0 keystrokes in assets/sounds/keys).
typing = true
typing_volume = 0.1        # 0..1
# Background music (CC0 tracks in music_dir; one picked at random per video, looped if short).
music = true
music_dir = "assets/music"
music_volume = 0.1       # 0..1, applied after loudness normalisation
sfx_volume = 0.3           # 0..1, timer ticks / dings / pops in Engines D and E

[engine_a]
fps = 30
# Base seconds per step; scaled by word count.
durations = [2.0, 3.5, 3.0, 2.5]
extra_seconds = 3.0        # added to every slide as a hold after the words are revealed
word_fade_ms = 120         # how long each typed letter takes to fade/settle in
crossfade_ms = 250

[engine_b]
also_export_4x5 = false
video = true               # also render slideshow.mp4 (same slides, animated)
fps = 30
# Base seconds per slide; scaled by word count like Engine A.
cover_seconds = 4.0
point_seconds = 6.0
word_fade_ms = 120         # how long each typed letter takes to fade/settle in
crossfade_ms = 250

[engine_d]
# Brain Test: procedurally generated mini-games, no Claude needed.
fps = 30
rounds = [3, 4]            # min, max rounds per video (random in between)
timer_seconds = 4          # answer countdown in each round
memory_seconds = 3         # how long the Memory test shows its words
max_seconds = 50           # drop a middle round if a video would run longer
word_fade_ms = 120
crossfade_ms = 250

[engine_e]
# Which One Are You: "How many apply to you?" checklists and "Pick one" reveals, written by Claude.
fps = 30
pick_timer_seconds = 3     # "Pick one" countdown before the reveals
reveal_seconds = 2.2       # hold after each reveal finishes typing
word_fade_ms = 120
crossfade_ms = 250

[engine_c]
whisper_model_gpu = "large-v3-turbo"
whisper_model_cpu = "small"
language = "en"
max_download_height = 1080
min_clip_seconds = 20
max_clip_seconds = 55      # target length asked of Claude / the heuristic
hard_max_seconds = 59      # every clip is trimmed (at a sentence end) to stay under 1 minute
subtitle_y = 1300
subtitle_font_size = 86
words_per_group = 3
analysis_fps = 10
switch_hold_seconds = 1.2
# On-screen title: shown as an intro hook at the top, then fades out (0 = keep for the whole clip).
title_seconds = 3.5
title_y = 270              # top edge of the title box (safe zone starts at 250)
# Caption credit line for the original creator (channel + video title + link are filled in).
credit_prefix = "🎙️ Credit:"
# Offline clip finder ("s" instead of Claude): words that make a moment on-topic for your niche.
keywords = ["mistake", "lesson", "secret", "truth", "habit", "success", "fail", "money", "life",
            "learned", "advice", "change", "fear", "love", "work"]

[claude]
# How Synergia gets scripts, topic ideas and highlights from Claude:
#   "code"  = automatically, through Claude Code (`claude -p`) on your claude.ai Pro login.
#             No copy/paste and no extra cost (it counts against your Pro usage limits).
#   "paste" = the manual clipboard round trip with claude.ai.
# If "code" fails (not signed in, usage limit, timeout), Synergia falls back to copy and paste.
mode = "code"
model = ""                 # "" = Claude Code's default; or "sonnet" / "opus" / "haiku"
effort = ""                # "" = default; or "low" / "medium" / "high"
timeout_seconds = 300

[output]
dir = "output"
cache_dir = "cache"

[youtube]
# Upload rendered videos as YouTube Shorts. Setup: README → "Uploading to YouTube".
client_secret = "secrets/client_secret.json"   # OAuth "Desktop app" client from Google Cloud
token_file = "secrets/youtube_token.json"      # written after the first sign-in
# private / unlisted / public. API projects that haven't passed Google's audit are forced to private.
privacy = "private"
category_id = 27           # 27 = Education, 22 = People & Blogs, 24 = Entertainment
language = "en"
notify_subscribers = true
synthetic_media = false    # YouTube's "altered or synthetic content" label: for realistic AI-made people/scenes
ask_after_render = true    # offer an upload right after a render (only once YouTube is set up)
# Posting times (local, 24h) used when you answer "n" to "When?": each video takes the next free one.
schedule_slots = ["12:00", "16:00"]

[autopilot]
# Autopilot page: render a week of videos in one go, review them, and queue them for YouTube.
count = 14                                   # videos per batch (2 slots/day = a week)
mix = { A = 2, B = 2, C = 5, D = 3, E = 2 }  # how many of each engine (scaled if count differs)
# Engine C: an episode URL pasted on the page wins; otherwise the newest unclipped episode of one
# of these channels is used (they take turns). Also editable on the Autopilot page.
channels = []                                # e.g. ["@ChrisWillx", "@hubermanlab"]
min_episode_minutes = 20                     # skip shorter uploads (highlight cuts, trailers)
# Uploads: YouTube's free API quota allows about 6 a day. Approved videos wait in a queue, and a
# daily Windows scheduled task uploads the next ones just after the quota resets (10:00 in Romania).
daily_upload_limit = 6
upload_time = "10:15"
